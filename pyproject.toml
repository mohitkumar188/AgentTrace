[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace"
version = "0.1.0"
authors = [
  { name="Mohit Kumar" },
]
description = "Observability and Self-Healing Engine for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "groq>=0.9.0",
]

[project.urls]
"Homepage" = "https://github.com/mohitkumar188/AgentTrace"
"Bug Tracker" = "https://github.com/mohitkumar188/AgentTrace/issues"

[tool.setuptools.packages.find]
where = ["src"]